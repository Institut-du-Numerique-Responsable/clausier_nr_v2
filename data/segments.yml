# Segments, sous-segments, sections et phases du clausier.
#
# titre_source : intitulé exact du document V2 (ODT/PDF).
# libelle      : libellé court d'affichage. Les libellés courts des segments et les
#                sous-segments du segment Matériels reprennent le classeur de
#                préparation de Paul Saulnier (colonnes « Segment » et « Sous segment »).
# prefixe      : préfixe des identifiants de clauses (voir docs/modele-documentaire.md).

phases:
  questionnaire:
    libelle: "Questionnaire (RFI/RFP)"
    libelle_excel: "RFI/RFP"
    description: >-
      Questionnaire type d'évaluation des soumissionnaires, en phase amont du marché.
  exigences:
    libelle: "Exigences (CCAP & CCTP)"
    libelle_excel: "CCAP & CCTP"
    description: >-
      Exigences à intégrer au cahier des charges, suivies pendant la phase d'exécution du marché.

segments:
